name: edu-agent-api
services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    env_file:
      - /etc/edu-agent-server/postgres.env
    ports:
      - "127.0.0.1:25432:5432"
    volumes:
      - postgres:/var/lib/postgresql
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/01-edu-agent.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d edu_agent"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  postgres:
    name: edu-agent-api-postgres
