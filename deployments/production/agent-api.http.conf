# Temporary HTTP site used only before the first certificate is issued.
server {
    listen 80;
    server_name agent-api.hrtiger.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/practise-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}
